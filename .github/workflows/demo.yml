# Publishes the browser demo (the app with its sample runs) to GitHub Pages.
#
# tools/make_demo_site.py writes the site as plain files, and tests/test_demo_site.py checks the builder first, so a
# broken build is never published. The repository's Pages source must be "GitHub Actions" (Settings, Pages); this sets
# it once, with an account that administers the repository:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
name: Browser demo

on:
  push:
    branches: [main]
    paths:
      - web/dist/**
      - samples/**
      - assets/social.png
      - python/vitro/**
      - tools/make_demo_site.py
      - tools/make_screenshots.py
      - tests/test_demo_site.py
      - .github/workflows/demo.yml
  workflow_dispatch:

permissions:
  contents: read

# one publication at a time, and one that has started is finished, not cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages asks for the address of the site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install NumPy, the only dependency of the builder
        run: python -m pip install numpy
      - name: Check the builder
        run: python tests/test_demo_site.py
      - name: Find the address of the site
        id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python tools/make_demo_site.py --out _site --site-url "$SITE_URL" --repo-url "$REPO_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitro-trace"
version = "0.1.0"
description = "Glass-box PyTorch neural network trace debugger and 3D activation player"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.scripts]
vitro = "vitro.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
